[project]
name = "llm-eval-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_benchmark"]

[project.scripts]
benchmark = "llm_eval_benchmark.cli:app"